path = "testroms"
path = "src/arch/ibmpc/bios"

system {
	model = "5160"

	boot = 0
	rtc  = 1

	memtest = 1

	floppy_disk_drives = 2

	patch_bios_init  = 1
	patch_bios_int19 = 1
}

cpu {
	model = "80286"
	speed = 24
}

ram {
	address = 0
	size    = 640K
	default = 0x00
}

# Extended RAM above 1 MB for T5-C / textmem e2e test.
# The first 64K backs HMA; the remaining 1M backs XMS allocations.
ram {
	address = 0x100000
	size    = 1088K
	default = 0x00
}

ems {
	size = 16M
	segment = 0xE000
}

xms {
	xms_size = 0
	umb_size = 88K
	umb_segm = 0xca00
	hma = 1
}

rom {
	address = 0xc8000
	size    = 8K
    default = 0xFF
}

rom {
	address = 0xf0000
	size    = 64K
    default = 0xFF
}

load {
    # The main BIOS
    format  = "binary"
    address = 0xf6000
    file    = "ibm-basic-1.10.rom"
}

load {
    # The main BIOS
    format  = "binary"
    address = 0xfe000
    file    = "glabios-5160-0.4.2.rom"
}

load {
    format  = "binary"
    address = 0xc8000
    file    = "ibmpc-pcex.rom"
}

terminal {
	driver = "null"
    escape = "F12"
	scale      = 1
	border     = 10
	fullscreen = 0
		
	mouse_mul_x = 1
	mouse_div_x = 1
	mouse_mul_y = 1
	mouse_div_y = 1
}

terminal {
	driver = "null"
}

video {
	device = "vga"
	blink = 16
	enable_irq = 0
	irq        = 2

	rom {
		address = 0xc0000
		size    = 24K
		default = 0xff
		file    = "ibm-vga.rom"
	}
}

video {
	device = "cga"
	font   = 1
	blink  = 30
}

video {
	device = "plantronics"
	font   = 1
	blink  = 30
}

video {
	device = "hgc"
	color  = "amber"
	blink  = 30
}

video {
	device = "mda"
	color  = "green"
	blink  = 30
}

speaker {
	volume      = 250
	lowpass     = 8000
	sample_rate = 44100

	driver      = "null"
}

serial {
	uart      = "8250"
	address   = 0x3f8
	irq       = 4
	multichar = 1
	driver = "stdio:file=/dev/null:flush=1"
}

serial {
	uart      = "8250"
	address   = 0x2f8
	irq       = 3
	multichar = 1
	driver    = "mouse:protocol=microsoft"
}

parport {
	address = 0x378
	driver  = "stdio:file=/dev/null:flush=1"
}

parport {
	address = 0x278
	driver  = "stdio:file=/dev/null:flush=1"
}

fdc {
	address  = 0x3f0
	irq      = 6

	drive0   = 0x00
	drive0   = 0x01

	accurate = 0
    ignore_eot = 1
}

# No default disk entry — the test image is always provided at runtime via:
#   -I "disk {" -I "drive = 0" -I 'type = "auto"' -I 'file = "images/testXXX.img"' -I "}"

