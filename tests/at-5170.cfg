# tests/at-5170.cfg
#
# Diagnostic configuration for the IBM PC/AT (5170) model.
# Native POST/DOS boot, injected keys, file writes/readback and guest warm reboot
# pass with both 1024K and the configured 15232K extended RAM. Basic SDL display
# and user-operated DOS keyboard commands also pass with 1024K extended RAM.
# Uses the IBM AT BIOS 15-Nov-1985 revision 2 (assembled from U27+U47 EPROMs).
#
# Memory layout (80286, 24-bit bus):
#   0x000000 – 0x09FFFF   640 KB conventional RAM
#   0x0C0000              VGA ROM (optional)
#   0x0F0000 – 0x0FFFFF   AT BIOS (64 KB ROM)
#   0x100000 – 0x10FFEF   HMA  (64 KB − 16 B, first slice of extended RAM)
#   0x110000 – 0xFDFFFF   Extended memory / EMB pool
#   0xFE0000 – 0xFFFFFF   Reserved ROM window (BIOS mirrored automatically)
#
# The [ram] block at 0x100000 is the single physical backing for both HMA
# and the XMS EMB pool.  xms_size = 0 tells the XMS layer to carve
# allocations from this block instead of malloc-ing host memory.
# hma = 1 reserves the first 64 KB − 16 B of that block for the HMA window.
#
# Use a 1.2 MB boot image for the configured type-2 drive.
# Reproducible native boot check: tests/test_at_native_boot.py --emulator <binary>
# Full-RAM check: tests/test_at_native_acceptance.py --emulator <binary> --full-ram
# Usage:
#   src/arch/ibmpc/pce-ibmpc -R -c tests/at-5170.cfg \
#     -I "disk {" -I "drive = 0" -I 'type = "auto"' \
#     -I 'file = "your-1200k-boot.img"' -I "}"

path = "testroms"

system {
	model             = "5170"
	boot              = 0
	memtest           = 0
	floppy_disk_drives = 2
	# Keep native AT reset/resume: PCEX startup can reboot instead of
	# resuming a 286 protected-mode caller (observed in CheckIt).
	patch_bios_init   = 0
	# Native disk boot. Tested AMI assisted DOS boot may use 1 with PCEX
	# loaded separately at C8000; that does not validate native HDD PIO.
	patch_bios_int19  = 0
}

cpu {
	model = "80286"
	# Multiplier of the 4.77 MHz base clock, NOT a frequency in MHz.
	# 2x is a diagnostic preset (~9.55 MHz nominal); with the current
	# approximate 286 instruction timings it passes the IBM refresh test.
	# Exact 6/8 MHz AT clocking and cycle timing remain unimplemented.
	speed = 2
}

ram {
	address = 0
	size    = 640K
	default = 0x00
}

# Extended RAM above 1 MB — single block backing both HMA and EMB pool.
# Stop RAM below the reserved top 128 KB ROM window.
# On 80286 the XMS layer carves this block instead of malloc-ing separately.
ram {
	address = 0x100000
	size    = 15232K
	default = 0x00
}

rom {
	address = 0xf0000
	size    = 64K
	default = 0xff
}

load {
	# IBM PC/AT BIOS 15-Nov-1985 rev 2 (assembled from U27+U47 EPROMs)
	format  = "binary"
	address = 0xf0000
	file    = "ibm-at-1985-11-15-02.rom"
}

xms {
	# xms_size = 0: on 80286 the EMB pool is backed by the physical [ram]
	# block above 0x100000 — no separate malloc pool is used.
	# On sub-286 CPUs this would mean "no XMS memory"; use a non-zero value
	# (e.g. xms_size = 16M) for those configs if XMS is needed.
	xms_size = 0

	# hma = 1: reserve the first 64 KB − 16 B of the extended RAM block
	# (physical 0x100000–0x10FFEF) as the High Memory Area.
	hma      = 1
}

# CMOS / RTC
# Equipment bytes are auto-populated from config by pc_cmos_populate_from_config.
# A loaded CMOS file overrides these defaults, including the drive types below.
# Optionally point to a persistent .nvr file so CMOS survives across runs:
#   file = "tests/at-cmos.nvr"
#
# sync_rtc_on_start = 1 (default): always stamp host clock on startup.
# sync_rtc_on_start = 0: preserve the time saved in the .nvr file.
cmos {
	# Installed drive types: 1=360K, 2=1.2M, 3=720K, 4=1.44M, 5=2.88M.
	# The original IBM AT BIOS does not support type 4/5 drives.
	floppy0_type = 2
	floppy1_type = 2
	# file             = "tests/at-cmos.nvr"
	sync_rtc_on_start  = 1
}

terminal {
	driver = "sdl"
	escape = "F12"
	scale  = 1
	border = 10
}

terminal {
	driver = "null"
}

video {
	device = "vga"
	blink  = 16

	rom {
		address = 0xc0000
		size    = 24K
		default = 0xff
		file    = "ibm-vga.rom"
	}
}

video {
	device = "cga"
	font   = 1
	blink  = 30
}

video {
	device = "mda"
	color  = "green"
	blink  = 30
}

# Fixed-disk half of the AT adapter, with no hard drives attached.
# This fixture remains diskless. Native CHS disks can be bound with
# drive0=128 plus a disk section and matching cmos.hard_disk0_type (1-14).
wd1003 {}

fdc {
	address     = 0x3f0
	irq         = 6
	drive0      = 0x00
	drive1      = 0x01
	# Nominal RPM for DD data-rate matching only; mechanical timing is separate.
	drive0_rpm  = 360
	drive1_rpm  = 360
	accurate    = 0
	ignore_eot  = 1
}

serial {
	uart      = "8250"
	address   = 0x3f8
	irq       = 4
	multichar = 1
	driver    = "stdio:file=/dev/null:flush=1"
}

parport {
	address = 0x378
	driver  = "stdio:file=/dev/null:flush=1"
}
